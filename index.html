<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-page-node-id="zIrWdUWasVumTPVQdd4KiL">
<head data-page-node-id="znV1TsQDn0cUHbB86ic3DL">
<meta charset="UTF-8" data-page-node-id="7qHnh1XNEtxFWyAQd9KiGc">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" data-page-node-id="t1pGi4lKCGAAIzdx4YObxS">
<meta name="color-scheme" content="light dark" data-page-node-id="ixkG7I2tBLCdOE4rE7ExRv">
<title>日程</title>
<style>
  :root{
    --bg:#F2EEE3;
    --bg-deep:#E9E2D2;
    --panel:#FBF9F4;
    --panel-2:#F6F2E8;
    --ink:#413B31;
    --ink-soft:#7E7666;
    --ink-faint:#A79E8B;
    --line:#E5DECD;
    --line-strong:#D5CAB4;
    --accent:#8B7B5C;
    --accent-ink:#FFFDF7;
    --shadow:0 12px 34px rgba(83,70,46,.10);
    --col-w:336px;
    --hour-h:52px;
    --radius:14px;
  }
  [data-theme="dark"]{
    --bg:#22201C;
    --bg-deep:#191714;
    --panel:#2C2924;
    --panel-2:#35312A;
    --ink:#EFE9DC;
    --ink-soft:#ADA48F;
    --ink-faint:#7E7666;
    --line:#423D34;
    --line-strong:#574F41;
    --accent:#C9B68D;
    --accent-ink:#24211C;
    --shadow:0 16px 44px rgba(0,0,0,.38);
  }

  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    transition:background 320ms ease,color 320ms ease;
  }
  body.locked{overflow:hidden;}
  button,input,textarea{font:inherit;}
  button{cursor:pointer;}

  .app{height:100%;display:flex;flex-direction:column;}
  @supports(height:100dvh){ .app{height:100dvh;} }

  /* ---------- 顶栏 ---------- */
  .topbar{
    flex:0 0 auto;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:18px 26px 12px;
  }
  .brand{display:flex;align-items:baseline;gap:12px;min-width:0;}
  .brand h1{
    margin:0;font-size:22px;font-weight:650;letter-spacing:.04em;
    font-family:"Songti SC","Noto Serif SC",Georgia,serif;
  }
  .brand .brand-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);align-self:center;opacity:.85;}
  .brand .brand-sub{font-size:12px;color:var(--ink-soft);white-space:nowrap;letter-spacing:.02em;}
  .toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
  .icon-btn{
    width:34px;height:34px;display:grid;place-items:center;
    border:1px solid var(--line);border-radius:10px;
    background:var(--panel);color:var(--ink);
    transition:background 180ms ease,border-color 180ms ease,transform 180ms ease;
  }
  .icon-btn:hover{background:var(--panel-2);border-color:var(--line-strong);transform:translateY(-1px);}
  .icon-btn:active{transform:translateY(0);}
  .icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .text-btn{
    height:34px;padding:0 12px;border:1px solid var(--line);border-radius:10px;
    background:var(--panel);color:var(--ink-soft);font-size:12px;
    transition:background 180ms ease,color 180ms ease,border-color 180ms ease;
  }
  .text-btn:hover{background:var(--panel-2);color:var(--ink);border-color:var(--line-strong);}
  .text-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .text-btn.primary:hover{filter:brightness(1.06);color:var(--accent-ink);}
  .divider{width:1px;height:20px;background:var(--line);margin:0 4px;}

  /* ---------- 日期条 ---------- */
  .date-strip{
    flex:0 0 auto;display:flex;gap:8px;overflow-x:auto;
    padding:4px 26px 16px;scrollbar-width:none;
  }
  .date-strip::-webkit-scrollbar{display:none;}
  .date-pill{
    flex:0 0 auto;min-width:64px;padding:9px 12px 8px;
    border:1px solid transparent;border-radius:13px;background:transparent;
    color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;gap:1px;
    transition:background 260ms ease,color 260ms ease,transform 260ms ease,border-color 260ms ease;
  }
  .date-pill:hover{background:var(--panel);transform:translateY(-2px);}
  .date-pill .pill-dow{font-size:11px;letter-spacing:.06em;opacity:.85;}
  .date-pill .pill-day{font-size:19px;font-weight:600;line-height:1.1;}
  .date-pill .pill-month{font-size:10px;opacity:.7;}
  .date-pill.today:not(.active){border-color:var(--line-strong);color:var(--ink);}
  .date-pill.today:not(.active)::after{
    content:"";width:4px;height:4px;border-radius:50%;background:var(--accent);margin-top:2px;
  }
  .date-pill.active{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px rgba(110,95,65,.18);}
  .date-pill.active .pill-dow,.date-pill.active .pill-month{opacity:.8;}

  /* ---------- 舞台 / 横向轮播 ---------- */
  .stage{
    position:relative;flex:1 1 auto;min-height:0;overflow:hidden;
    -webkit-mask-image:linear-gradient(to right,transparent 0,#000 7%,#000 93%,transparent 100%);
    mask-image:linear-gradient(to right,transparent 0,#000 7%,#000 93%,transparent 100%);
  }
  .track{
    position:relative;display:flex;gap:18px;align-items:flex-start;
    height:100%;padding-top:4px;will-change:transform;
    transition:transform 560ms cubic-bezier(.2,.85,.25,1);
  }
  .day-col{
    flex:0 0 var(--col-w);width:var(--col-w);
    height:100%;display:flex;flex-direction:column;
    opacity:.3;transform:scale(.945);transform-origin:top center;
    filter:saturate(.65);
    transition:opacity 420ms ease,transform 520ms cubic-bezier(.2,.85,.25,1),filter 420ms ease;
  }
  .day-col.active{opacity:1;transform:scale(1);filter:none;}
  .grid-scroll{
    flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
    scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent;
    padding-right:3px;
  }
  .grid-scroll::-webkit-scrollbar{width:7px;}
  .grid-scroll::-webkit-scrollbar-track{background:transparent;}
  .grid-scroll::-webkit-scrollbar-thumb{
    background:var(--line-strong);border-radius:8px;border:2px solid var(--bg);
  }
  .grid-scroll::-webkit-scrollbar-thumb:hover{background:var(--accent);}
  .grid-wrap{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;}
  .fold-stack{
    position:absolute;left:49px;right:8px;z-index:6;
    display:flex;align-items:center;gap:8px;width:max-content;max-width:calc(100% - 8px);
    padding:5px 10px 5px 8px;border:1px solid var(--line-strong);border-radius:10px;
    background:var(--panel);box-shadow:0 4px 14px rgba(70,58,36,.13);
    color:var(--ink-soft);font-size:10px;cursor:pointer;
    transition:color 180ms ease,border-color 180ms ease,transform 180ms ease,background 180ms ease;
  }
  .fold-stack:hover{color:var(--ink);border-color:var(--accent);transform:translateY(-1px);}
  .fold-top{top:6px;}
  .fold-bottom{bottom:6px;}
  .fold-cards{position:relative;display:block;width:26px;height:16px;flex:0 0 26px;}
  .fold-cards i{
    position:absolute;top:0;width:22px;height:13px;border-radius:4px;
    border:1px solid rgba(255,255,255,.55);background:var(--c,var(--accent));
    box-shadow:0 1px 3px rgba(60,50,30,.16);
  }
  .fold-cards i:nth-child(1){left:0;transform:rotate(-9deg);opacity:.55;}
  .fold-cards i:nth-child(2){left:2px;transform:rotate(-3deg);opacity:.75;}
  .fold-cards i:nth-child(3){left:4px;transform:rotate(2deg);}
  .fold-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .event.folded{opacity:0;pointer-events:none;}
  .day-head{
    height:58px;display:flex;align-items:center;gap:10px;padding:0 6px 10px;
  }
  .day-head .big-day{font-size:26px;font-weight:600;line-height:1;font-family:"Songti SC",Georgia,serif;}
  .day-head .meta{display:flex;flex-direction:column;gap:2px;}
  .day-head .meta b{font-size:12px;font-weight:600;}
  .day-head .meta span{font-size:11px;color:var(--ink-soft);}
  .day-head .count{
    margin-left:auto;font-size:11px;color:var(--ink-soft);
    border:1px solid var(--line);border-radius:20px;padding:3px 9px;background:var(--panel);
  }

  .grid{
    position:relative;display:flex;border:1px solid var(--line);
    border-radius:var(--radius);background:var(--panel);
    box-shadow:var(--shadow);overflow:hidden;
  }
  .axis{position:relative;flex:0 0 46px;border-right:1px solid var(--line);background:var(--panel-2);}
  .axis .tick{
    position:absolute;right:8px;transform:translateY(-50%);
    font-size:10px;color:var(--ink-faint);font-variant-numeric:tabular-nums;
  }
  .lane{
    position:relative;flex:1 1 auto;min-width:0;
    background-image:
      repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--hour-h)),
      repeating-linear-gradient(to bottom,transparent 0 calc(var(--hour-h) / 2),rgba(140,125,95,.09) calc(var(--hour-h) / 2),rgba(140,125,95,.09) calc(var(--hour-h) / 2 + 1px),transparent calc(var(--hour-h) / 2 + 1px) var(--hour-h));
    touch-action:pan-y;user-select:none;-webkit-user-select:none;
    cursor:crosshair;
  }
  .lane.creating{cursor:grabbing;}
  .empty-hint{
    position:absolute;top:112px;left:50%;transform:translateX(-50%);
    font-size:11px;color:var(--ink-faint);white-space:nowrap;pointer-events:none;
    letter-spacing:.02em;
  }
  .now-line{
    position:absolute;left:0;right:0;height:1px;background:#C96B57;z-index:6;pointer-events:none;
  }
  .now-line::before{
    content:"";position:absolute;left:-3px;top:-3px;width:7px;height:7px;border-radius:50%;background:#C96B57;
  }

  /* ---------- 日程色块 ---------- */
  .event{
    position:absolute;z-index:3;display:block;text-align:left;
    border:1px solid color-mix(in srgb,var(--ev-dot) 55%,transparent);
    border-radius:10px;
    background:var(--ev-bg);color:var(--ev-ink);
    padding:6px 9px;overflow:hidden;
    box-shadow:0 2px 6px rgba(90,75,50,.06);
    transition:box-shadow 200ms ease,transform 200ms ease,opacity 200ms ease;
  }
  .event:hover{box-shadow:0 6px 16px rgba(80,65,40,.14);transform:translateY(-1px);z-index:5;}
  .event:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .event.is-hidden{opacity:0;}
  .event .ev-title{
    display:block;font-size:12px;font-weight:650;line-height:1.3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .event .ev-time{
    display:block;margin-top:2px;font-size:10px;line-height:1.2;opacity:.78;
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .event.compact{padding:3px 8px;}
  .event.compact .ev-time{display:none;}
  .event.compact .ev-title{font-size:11px;line-height:1.5;}

  .draft-event{
    position:absolute;z-index:8;pointer-events:none;
    border:1px dashed var(--accent);border-radius:10px;
    background:rgba(139,123,92,.14);
    background:color-mix(in srgb,var(--accent) 14%,transparent);
    min-height:8px;
  }
  .draft-event .draft-tag{
    position:absolute;left:-1px;top:-22px;white-space:nowrap;
    background:var(--accent);color:var(--accent-ink);
    font-size:10px;padding:2px 7px;border-radius:6px;font-variant-numeric:tabular-nums;
  }

  /* ---------- 底部提示 ---------- */
  .foot-hint{
    flex:0 0 auto;text-align:center;padding:8px 16px 14px;
    font-size:11px;color:var(--ink-faint);letter-spacing:.03em;
  }

  /* ---------- 展开详情 ---------- */
  .overlay{
    position:fixed;inset:0;z-index:50;display:grid;place-items:center;
    background:rgba(60,52,38,.26);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    opacity:0;pointer-events:none;transition:opacity 300ms ease;
  }
  .overlay.show{opacity:1;pointer-events:auto;}
  .detail-card{
    position:relative;width:min(440px,92vw);
    max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);overflow-y:auto;
    scrollbar-width:thin;
    background:var(--panel);border-radius:18px;overflow-x:hidden;
    box-shadow:0 28px 80px rgba(55,45,25,.26);
    opacity:0;visibility:hidden;
  }
  .detail-card.visible{visibility:visible;}
  .detail-accent{height:8px;background:var(--ev-bg,#DCE8D9);}
  .detail-body{
    padding:20px 22px 18px;
    opacity:0;transform:translateY(8px);
    transition:opacity 220ms ease 110ms,transform 280ms ease 110ms;
  }
  .content-in .detail-body{opacity:1;transform:none;}
  .detail-head{display:flex;align-items:flex-start;gap:12px;}
  .detail-date{font-size:11px;color:var(--ink-soft);margin-bottom:5px;letter-spacing:.04em;}
  .title-input{
    width:100%;border:0;background:transparent;color:var(--ink);
    font-size:21px;font-weight:650;padding:0;outline:none;
  }
  .title-input::placeholder,.note-input::placeholder{color:var(--ink-faint);}
  .detail-head .icon-btn{margin-left:auto;flex:0 0 auto;}
  .time-row{display:flex;align-items:stretch;gap:10px;margin-top:20px;}
  .time-picker{
    flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;
    border:1px solid var(--line);border-radius:12px;
    background:var(--panel-2);padding:9px 10px 6px;
  }
  .tp-title{font-size:11px;color:var(--ink-soft);letter-spacing:.03em;}
  .tp-steppers{display:flex;align-items:center;justify-content:center;gap:3px;height:96px;}
  .stepper{display:flex;flex-direction:column;align-items:center;gap:4px;width:46px;}
  .step-btn{
    width:30px;height:21px;padding:0;display:grid;place-items:center;
    border:1px solid var(--line);border-radius:7px;
    background:var(--panel);color:var(--ink-soft);font-size:8px;line-height:1;
    transition:background 180ms ease,color 180ms ease,border-color 180ms ease,transform 180ms ease;
  }
  .step-btn:hover:not(:disabled){background:var(--panel-2);color:var(--ink);border-color:var(--line-strong);transform:translateY(-1px);}
  .step-btn:active:not(:disabled){transform:translateY(0);}
  .step-btn:disabled{opacity:.3;cursor:default;}
  .step-value{
    width:46px;height:36px;display:grid;place-items:center;
    font-family:inherit;font-size:18px;font-weight:600;line-height:1;
    color:var(--ink);font-variant-numeric:tabular-nums;
    transition:opacity 140ms ease,transform 140ms ease;
  }
  .step-value.fading{opacity:0;transform:translateY(-5px);}
  .tp-colon{font-size:16px;color:var(--ink-soft);padding-bottom:2px;font-variant-numeric:tabular-nums;}
  .time-row .arrow{align-self:center;color:var(--ink-faint);font-size:13px;}
  .note-input:focus{border-color:var(--accent);}
  .color-row{display:flex;gap:9px;margin-top:20px;align-items:center;}
  .color-row .label{font-size:11px;color:var(--ink-soft);margin-right:2px;}
  .swatch{
    width:22px;height:22px;border-radius:7px;border:2px solid transparent;
    padding:0;transition:transform 180ms ease,border-color 180ms ease;
  }
  .swatch:hover{transform:scale(1.14);}
  .swatch.on{border-color:var(--ink);transform:scale(1.1);}
  .note-input{
    width:100%;margin-top:18px;min-height:92px;resize:vertical;
    border:1px solid var(--line);border-radius:11px;background:var(--panel-2);
    color:var(--ink);padding:11px 12px;font-size:13px;line-height:1.6;outline:none;
    transition:border-color 180ms ease;
  }
  .detail-foot{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-top:16px;padding-top:14px;border-top:1px solid var(--line);
  }
  .saved{font-size:10px;color:var(--ink-faint);}
  .danger{
    border:1px solid var(--line);background:transparent;color:var(--ink-soft);
    border-radius:9px;padding:6px 11px;font-size:11px;
    transition:color 180ms ease,border-color 180ms ease,background 180ms ease;
  }
  .danger:hover{color:#B25C4A;border-color:#D9A69B;background:rgba(178,92,74,.06);}

  /* ---------- 批量 / 规划面板 ---------- */
  .tools-card{
    width:min(520px,94vw);
    max-height:88vh;max-height:calc(100dvh - 24px);overflow-y:auto;
    background:var(--panel);border-radius:18px;box-shadow:0 28px 80px rgba(55,45,25,.26);
    opacity:0;transform:translateY(14px) scale(.985);
    transition:opacity 240ms ease,transform 300ms cubic-bezier(.2,.9,.25,1);
    scrollbar-width:thin;
  }
  .tools-overlay.show .tools-card{opacity:1;transform:none;}
  .tools-head{
    display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
    padding:20px 22px 14px;border-bottom:1px solid var(--line);
  }
  .tools-title{font-size:18px;font-weight:650;}
  .tools-sub{font-size:11px;color:var(--ink-soft);margin-top:4px;}
  .tools-body{padding:18px 22px 20px;display:flex;flex-direction:column;gap:16px;}
  .tools-add,.tools-remove{display:flex;flex-direction:column;gap:16px;min-width:0;}
  .field{display:flex;flex-direction:column;gap:7px;min-width:0;}
  .field>span{font-size:11px;color:var(--ink-soft);letter-spacing:.03em;}
  .field-row{display:flex;gap:14px;}
  .field-row .field{flex:1;}
  .field-input{
    width:100%;height:36px;padding:0 10px;outline:none;
    border:1px solid var(--line);border-radius:9px;background:var(--panel-2);color:var(--ink);
    font-size:13px;font-variant-numeric:tabular-nums;
    transition:border-color 180ms ease;
  }
  .field-input:focus{border-color:var(--accent);}
  .inline{display:flex;gap:8px;}
  .inline select{cursor:pointer;}
  .plan-range{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .plan-range .tp-steppers{height:88px;gap:0;}
  .plan-range>span{font-size:11px;color:var(--ink-soft);}
  .target-row{display:flex;flex-wrap:wrap;gap:8px 14px;}
  .target-row label,.weekday-row label{
    display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink);cursor:pointer;
  }
  .target-row input,.weekday-row input{accent-color:var(--accent);margin:0;cursor:pointer;}
  .weekday-row{display:flex;flex-wrap:wrap;gap:10px;padding:4px 0 0 2px;}
  .tools-foot{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding-top:14px;border-top:1px solid var(--line);
  }
  .tools-note{font-size:10px;color:var(--ink-faint);margin-right:auto;}
  .tools-tabs{display:flex;gap:6px;padding:14px 22px 0;}
  .tools-tabs button{
    border:1px solid transparent;background:transparent;color:var(--ink-soft);
    border-radius:9px;padding:7px 14px;font-size:12px;cursor:pointer;
    transition:background 180ms ease,color 180ms ease,border-color 180ms ease;
  }
  .tools-tabs button:hover{color:var(--ink);background:var(--panel-2);}
  .tools-tabs button.on{color:var(--ink);background:var(--panel-2);border-color:var(--line-strong);font-weight:600;}
  .search-row{display:flex;align-items:center;gap:8px;}
  .search-row .field-input{flex:1;}
  .search-results{
    max-height:230px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;
    background:var(--panel-2);scrollbar-width:thin;
  }
  .result-empty{padding:18px 12px;text-align:center;font-size:11px;color:var(--ink-faint);}
  .result-item{
    display:flex;align-items:center;gap:9px;padding:9px 11px;cursor:pointer;
    border-bottom:1px solid var(--line);transition:background 160ms ease;
  }
  .result-item:last-child{border-bottom:0;}
  .result-item:hover{background:var(--panel);}
  .result-item input{accent-color:var(--accent);margin:0;cursor:pointer;flex:0 0 auto;}
  .result-dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--accent));flex:0 0 auto;}
  .result-main{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px;}
  .result-main b{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .result-main span{font-size:10px;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .result-actions{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--ink-soft);}
  .result-actions button{
    border:0;background:transparent;color:var(--accent);cursor:pointer;padding:2px;font-size:11px;
  }
  .result-actions button:hover{text-decoration:underline;}

  /* ---------- 提示条 ---------- */
  .toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);
    z-index:80;background:var(--ink);color:var(--panel);
    font-size:12px;padding:9px 16px;border-radius:10px;
    opacity:0;pointer-events:none;transition:opacity 220ms ease,transform 220ms ease;
    box-shadow:0 10px 30px rgba(0,0,0,.16);
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  @media (max-width:900px){
    :root{--col-w:300px;}
    .brand-sub{display:none;}
    .topbar{padding:14px 16px 10px;}

<script>
(function(){
  'use strict';

  /* ================= 常量与工具 ================= */
  const STORAGE_KEY = 'yi-schedule-v1';
  const START_HOUR = 0, END_HOUR = 24, HOUR_H = 52, SNAP = 5;
  const DAY_MS = 86400000;
  const DOW = ['周日','周一','周二','周三','周四','周五','周六'];
  const PALETTE = [
    {bg:'#DBE7D8',ink:'#3B5440',dot:'#8FB08A'},
    {bg:'#F2E0C7',ink:'#6B5230',dot:'#D8AE76'},
    {bg:'#D8E3F1',ink:'#3D5372',dot:'#8FAED4'},
    {bg:'#EED8E2',ink:'#6E4257',dot:'#CE9AB4'},
    {bg:'#E5DCF0',ink:'#554468',dot:'#AC97CA'},
    {bg:'#F0E8C5',ink:'#665C31',dot:'#CBBE72'},
    {bg:'#D5E8E6',ink:'#35605C',dot:'#87BDB8'}
  ];

  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2,'0');
  const clamp = (v,a,b) => Math.min(b,Math.max(a,v));
  const uid = () => 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);

  function toKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function fromKey(k){ const p=k.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
  function addDays(k,n){ const d=fromKey(k); d.setDate(d.getDate()+n); return toKey(d); }
  function mondayOf(k){
    const d=fromKey(k);
    d.setDate(d.getDate()-((d.getDay()+6)%7));
    return toKey(d);
  }
  // 内置国务院办公厅 2026 年放假安排（含调休上班日）
  const HOLIDAYS=new Set(), MAKEUP_WORKDAYS=new Set([
    '2026-01-04','2026-02-14','2026-02-28','2026-05-09','2026-09-20','2026-10-10',
    '2027-01-31','2027-02-14','2027-05-08','2027-09-26','2027-10-09'
  ]);
  function addHolidayRange(from,to){
    let k=from;
    while(k<=to){ HOLIDAYS.add(k); k=addDays(k,1); }
  }
  addHolidayRange('2026-01-01','2026-01-03');
  addHolidayRange('2026-02-15','2026-02-23');
  addHolidayRange('2026-04-04','2026-04-06');
  addHolidayRange('2026-05-01','2026-05-05');
  addHolidayRange('2026-06-19','2026-06-21');
  addHolidayRange('2026-09-25','2026-09-27');
  addHolidayRange('2026-10-01','2026-10-07');
  addHolidayRange('2027-01-01','2027-01-03');
  addHolidayRange('2027-02-05','2027-02-13');
  addHolidayRange('2027-04-03','2027-04-05');
  addHolidayRange('2027-05-01','2027-05-05');
  addHolidayRange('2027-06-09','2027-06-09');
  addHolidayRange('2027-09-15','2027-09-15');
  addHolidayRange('2027-10-01','2027-10-07');
  function fmtDate(k){
    const d=fromKey(k);
    return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 '+DOW[d.getDay()];
  }
  function clampM(m){ return clamp(m, START_HOUR*60, END_HOUR*60); }
  function snapM(m){ return clampM(Math.round(m/SNAP)*SNAP); }
  function yToM(y){ return snapM(START_HOUR*60 + (y/HOUR_H)*60); }
  function mToY(m){ return ((m-START_HOUR*60)/60)*HOUR_H; }
  function fmtTime(m){ return pad(Math.floor(m/60))+':'+pad(m%60); }
  function parseTime(s){
    const p=String(s||'').split(':');
    if(p.length!==2) return null;
    const h=Number(p[0]), m=Number(p[1]);
    if(!Number.isFinite(h)||!Number.isFinite(m)) return null;
    return h*60+m;
  }

  /* ================= 状态 ================= */
  function defaults(){
    const today=toKey(new Date());
    return {events:{},selectedDate:today,rangeStart:mondayOf(today),theme:'light',colorCursor:0};
  }
  function load(){
    try{
      const raw=localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaults();
      const o=JSON.parse(raw);
      if(!o||typeof o!=='object'||typeof o.events!=='object'||o.events===null) return defaults();
      const d=defaults();
      const sel=/^\d{4}-\d{2}-\d{2}$/.test(o.selectedDate||'')?o.selectedDate:d.selectedDate;
      return {
        events:o.events,
        selectedDate:sel,
        rangeStart:mondayOf(sel),
        theme:o.theme==='dark'?'dark':'light',
        colorCursor:Number.isFinite(o.colorCursor)?o.colorCursor:0
      };
    }catch(err){ return defaults(); }
  }
  let state=load();
  let storageOK=true;
  function save(){
    try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(state)); }
    catch(err){
      if(storageOK){ storageOK=false; toast('浏览器存储不可用，本次编辑无法保存'); }
    }
  }

  const stage=$('stage'), track=$('track'), strip=$('dateStrip');
  const overlay=$('overlay'), card=$('detailCard');
  let columns=[];

  /* ================= 提示 ================= */
  let toastTimer=null;
  function toast(msg){
    const t=$('toast'); t.textContent=msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
  }

  /* ================= 日期条 ================= */
  function renderStrip(){
    strip.innerHTML='';
    const today=toKey(new Date());
    for(let i=0;i<7;i++){
      const key=addDays(state.rangeStart,i), d=fromKey(key);
      const b=document.createElement('button');
      b.type='button';
      b.className='date-pill'+(key===state.selectedDate?' active':'')+(key===today?' today':'');
      b.innerHTML='<span class="pill-dow">'+DOW[d.getDay()]+'</span>'+
                  '<span class="pill-day">'+d.getDate()+'</span>'+
                  '<span class="pill-month">'+(d.getMonth()+1)+'月</span>';
      b.addEventListener('click',()=>selectDate(key));
      strip.appendChild(b);
    }
    const active=strip.querySelector('.active');
    if(active){
      strip.scrollLeft=active.offsetLeft-strip.clientWidth/2+active.offsetWidth/2;
    }
  }

  /* ================= 列构建与绘制 ================= */
  function buildColumns(){
    if(detail.open) closeDetail();
    track.innerHTML='';
    columns=[];
    for(let i=0;i<7;i++){
      const key=addDays(state.rangeStart,i), d=fromKey(key);
      const col=document.createElement('section');
      col.className='day-col'+(key===state.selectedDate?' active':'');
      col.dataset.key=key;
      const height=(END_HOUR-START_HOUR)*HOUR_H;
      let ticks='';
      for(let h=START_HOUR;h<=END_HOUR;h++){
        const y=mToY(h*60);
        const pos=h===START_HOUR?'top:6px;transform:none':(h===END_HOUR?'top:'+(y-12)+'px':'top:'+y+'px');
        ticks+='<span class="tick" style="'+pos+'">'+pad(h)+':00</span>';
      }
      col.innerHTML=
        '<div class="day-head">'+
          '<span class="big-day">'+d.getDate()+'</span>'+
          '<span class="meta"><b>'+DOW[d.getDay()]+'</b><span>'+(d.getMonth()+1)+'月 · '+d.getFullYear()+'</span></span>'+
          '<span class="count">0 项</span>'+
        '</div>'+
        '<div class="grid-wrap">'+
          '<button type="button" class="fold-stack fold-top" hidden></button>'+
          '<div class="grid-scroll">'+
            '<div class="grid" style="height:'+height+'px">'+
              '<div class="axis">'+ticks+'</div>'+
              '<div class="lane" data-key="'+key+'"><div class="now-line" data-key="'+key+'" hidden></div></div>'+
            '</div>'+
          '</div>'+
          '<button type="button" class="fold-stack fold-bottom" hidden></button>'+
        '</div>';
      track.appendChild(col);
      columns.push(col);
      bindLane(col.querySelector('.lane'),key);
      col.querySelector('.grid-scroll').addEventListener('scroll',()=>updateFolds(key),{passive:true});
      col.querySelector('.fold-top').addEventListener('click',()=>revealFold(key,'top'));
      col.querySelector('.fold-bottom').addEventListener('click',()=>revealFold(key,'bottom'));
      col.querySelector('.day-head').addEventListener('click',()=>selectDate(key));
      fillColumn(key);
    }
    updateNowLines();
    track.style.transition='none';
    requestAnimationFrame(()=>{
      centerSelected(); autoScrollDay(); updateAllFolds();

  function eventList(key){ return state.events[key]||(state.events[key]=[]); }

  function layout(list){
    const sorted=list.slice().sort((a,b)=>a.start-b.start||a.end-b.end);
    const groups=[]; let cur=[], curEnd=-1;
    sorted.forEach(e=>{
      if(cur.length && e.start>=curEnd){ groups.push(cur); cur=[]; curEnd=-1; }
      cur.push(e); curEnd=Math.max(curEnd,e.end);
    });
    if(cur.length) groups.push(cur);
    groups.forEach(g=>{
      const ends=[];
      g.forEach(e=>{
        let i=ends.findIndex(end=>end<=e.start);
        if(i<0){ i=ends.length; ends.push(e.end); } else ends[i]=e.end;
        e._col=i;
      });
      g.forEach(e=>{ e._cols=ends.length; });
    });
  }

  function fillColumn(key){
    const col=columns.find(c=>c.dataset.key===key);
    if(!col) return;
    const lane=col.querySelector('.lane');
    lane.querySelectorAll('.event,.draft-event,.empty-hint').forEach(n=>n.remove());
    const list=eventList(key);
    layout(list);
    list.forEach(e=>lane.appendChild(makeEventEl(e)));
    if(!list.length){
      const hint=document.createElement('div');
      hint.className='empty-hint'; hint.textContent='长按空白 · 添加日程';
      lane.appendChild(hint);
    }
    col.querySelector('.count').textContent=list.length+' 项';
    updateFolds(key);
  }

  /* ---------- 视口外日程折叠成堆叠色块 ---------- */
  function updateFolds(key){
    const col=columns.find(c=>c.dataset.key===key);
    if(!col) return;
    const sc=col.querySelector('.grid-scroll');
    const topBtn=col.querySelector('.fold-top'), bottomBtn=col.querySelector('.fold-bottom');
    if(!sc.clientHeight){ topBtn.hidden=true; bottomBtn.hidden=true; return; }
    const vt=sc.scrollTop-1, vb=sc.scrollTop+sc.clientHeight+1;
    const list=eventList(key), above=[], below=[];
    list.forEach(e=>{
      const y1=mToY(e.start), y2=mToY(e.end);
      if(y2<=vt) above.push(e);
      else if(y1>=vb) below.push(e);
    });
    const folded=new Set(above.concat(below));
    const els={};
    col.querySelectorAll('.event').forEach(el=>{ els[el.dataset.id]=el; });
    list.forEach(e=>{ if(els[e.id]) els[e.id].classList.toggle('folded',folded.has(e)); });
    paintFold(topBtn,above,'上方');
    paintFold(bottomBtn,below,'下方');
  }
  function paintFold(btn,arr,label){
    if(!arr.length){ btn.hidden=true; return; }
    btn.hidden=false;
    const picked=label==='上方'?arr.slice(-3):arr.slice(0,3);
    const recent=picked.map(e=>PALETTE[e.colorIndex%PALETTE.length].bg);
    const html=recent.map(c=>'<i style="--c:'+c+'"></i>').join('');
    btn.innerHTML='<span class="fold-cards">'+html+'</span><span class="fold-label">'+label+' '+arr.length+' 项 · 点击展开</span>';
    btn.setAttribute('aria-label',label+'有 '+arr.length+' 项日程未显示，点击展开');
  }
  function revealFold(key,side){
    const col=columns.find(c=>c.dataset.key===key);
    if(!col) return;
    const sc=col.querySelector('.grid-scroll');
    const vt=sc.scrollTop, vb=sc.scrollTop+sc.clientHeight;
    const hidden=eventList(key).filter(e=>side==='top'?mToY(e.end)<=vt:mToY(e.start)>=vb)
      .sort((a,b)=>side==='top'?b.start-a.start:a.start-b.start);
    if(!hidden.length) return;
    const target=mToY(hidden[0].start);
    const top=side==='top'?Math.max(0,target-sc.clientHeight+80):Math.max(0,target-sc.clientHeight*0.25);
    if(typeof sc.scrollTo==='function') sc.scrollTo({top:top,behavior:'smooth'});
    else sc.scrollTop=top;
    updateFolds(key);
  }
  function updateAllFolds(){ columns.forEach(c=>updateFolds(c.dataset.key)); }

  function makeEventEl(e){

  /* ================= 长按 + 拖拽建日程 ================= */
  let press=null;
  function bindLane(lane,key){
    lane.addEventListener('pointerdown',e=>{
      if(e.button!==0) return;
      if(e.target.closest('.event')) return;
      if(key!==state.selectedDate){ selectDate(key); return; }
      const rect=lane.getBoundingClientRect();
      const anchor=yToM(e.clientY-rect.top);
      press={lane:lane,key:key,anchor:anchor,y0:e.clientY,id:e.pointerId,active:false,timer:null,draft:null,el:null};
      press.timer=setTimeout(()=>beginCreate(press),420);
      // 鼠标按下即捕获指针，拖动时不会丢失事件；触摸保留原生滚动
      if(e.pointerType==='mouse'){
        try{ lane.setPointerCapture(e.pointerId); }catch(err){}
      }
    });
    lane.addEventListener('pointermove',e=>{
      if(!press||press.id!==e.pointerId) return;
      if(!press.active){
        const dy=Math.abs(e.clientY-press.y0);
        if(e.pointerType==='touch'){
          if(dy>12) cancelPress();   // 触摸拖动视为滚动时间轴
          return;
        }
        if(dy<6) return;             // 鼠标轻微抖动不打断长按
        beginCreate(press);          // 鼠标按下即拖，立即开始创建
      }
      e.preventDefault();
      const rect=press.lane.getBoundingClientRect();
      const m=yToM(e.clientY-rect.top);
      let lo=Math.min(press.anchor,m), hi=Math.max(press.anchor,m);
      if(hi-lo<SNAP) hi=lo+SNAP;
      press.draft.start=clampM(lo); press.draft.end=clampM(hi);
      updateDraft(press);
    });
    lane.addEventListener('pointerup',()=>endPress(false));
    lane.addEventListener('pointercancel',()=>endPress(true));
    lane.addEventListener('pointerleave',e=>{
      if(press&&!press.active&&e.pointerType==='touch') cancelPress();
    });
  }
  function beginCreate(p){
    if(!press||press!==p) return;
    clearTimeout(p.timer);
    p.active=true;
    p.lane.classList.add('creating');
    p.lane.style.touchAction='none';   // 触摸创建时禁止浏览器接管滚动
    try{ p.lane.setPointerCapture(p.id); }catch(err){}
    p.draft={start:p.anchor,end:Math.min(END_HOUR*60,p.anchor+30)};
    p.el=document.createElement('div');
    p.el.className='draft-event';
    p.el.innerHTML='<span class="draft-tag"></span>';
    p.lane.appendChild(p.el);
    updateDraft(p);
    if(navigator.vibrate) navigator.vibrate(12);
  }
  function updateDraft(p){
    if(!p.el) return;
    const top=mToY(p.draft.start);
    const h=Math.max(10,mToY(p.draft.end)-mToY(p.draft.start));
    p.el.style.top=top+'px'; p.el.style.height=h+'px';
    p.el.querySelector('.draft-tag').textContent=fmtTime(p.draft.start)+' – '+fmtTime(p.draft.end);
  }
  function cancelPress(){
    if(press){
      clearTimeout(press.timer);
      press.lane.style.touchAction='';
      press=null;
    }
  }
  function endPress(cancelled){
    if(!press) return;
    clearTimeout(press.timer);
    const p=press; press=null;
    if(!p.active) return;
    p.lane.classList.remove('creating');
    p.lane.style.touchAction='';
    if(p.el) p.el.remove();
    try{ p.lane.releasePointerCapture(p.id); }catch(err){}
    if(cancelled) return;
    let start=p.draft.start, end=p.draft.end;
    if(end-start<10) end=Math.min(END_HOUR*60,start+30);
    const ev={id:uid(),title:'新日程',note:'',colorIndex:state.colorCursor%PALETTE.length,start:start,end:end};
    state.colorCursor++;
    eventList(p.key).push(ev);
    save(); fillColumn(p.key); openDetail(ev.id,true);
  }
  window.addEventListener('blur',cancelPress);

    document.querySelectorAll('.now-line').forEach(n=>{

  const detail={open:false,id:null,key:null};

  /* ---------- 上下三角箭头切换时间点（平滑淡入淡出，不循环） ---------- */
  function createStepper(host,values,onChange){
    const valueEl=host.querySelector('.step-value');
    const up=host.querySelector('.step-btn.up');
    const down=host.querySelector('.step-btn.down');
    let idx=0, timer=null;
    function render(){
      valueEl.textContent=pad(values[idx]);
      up.disabled=idx>=values.length-1;
      down.disabled=idx<=0;
    }
    function step(delta){
      const next=Math.max(0,Math.min(values.length-1,idx+delta));
      if(next===idx) return;
      clearTimeout(timer);
      valueEl.classList.add('fading');
      timer=setTimeout(()=>{
        idx=next; render(); valueEl.classList.remove('fading'); onChange();
      },140);
    }
    up.addEventListener('click',()=>step(1));
    down.addEventListener('click',()=>step(-1));
    render();
    return {
      value:()=>values[idx],
      setValue:(v)=>{
        const i=values.indexOf(v);
        if(i>=0){ clearTimeout(timer); valueEl.classList.remove('fading'); idx=i; render(); }
      }
    };
  }
  const hourValues=[], minuteValues=[];
  for(let h=START_HOUR;h<END_HOUR;h++) hourValues.push(h);
  for(let m=0;m<60;m+=SNAP) minuteValues.push(m);
  function createTimePicker(root,onChange){
    const h=createStepper(root.querySelector('[data-part="hour"]'),hourValues,onChange);
    const m=createStepper(root.querySelector('[data-part="minute"]'),minuteValues,onChange);
    return {
      value:()=>h.value()*60+m.value(),
      setValue:(v,smooth)=>{
        const t=v>=END_HOUR*60?END_HOUR*60-SNAP:v;
        h.setValue(Math.floor(t/60),smooth);
        m.setValue(t%60,smooth);
      }
    };
  }
  const startPicker=createTimePicker($('startPicker'),applyPickerTimes);
  const endPicker=createTimePicker($('endPicker'),applyPickerTimes);

  /* ---------- 批量添加日程 / 帮你规划 ---------- */
  function mountStepper(host,values){
    host.innerHTML='<button type="button" class="step-btn up" aria-label="增加">▲</button>'+
      '<span class="step-value"></span>'+
      '<button type="button" class="step-btn down" aria-label="减少">▼</button>';
    return createStepper(host,values,()=>{});
  }
  const tStartH=mountStepper($('toolStartHour'),hourValues);
  const tStartM=mountStepper($('toolStartMin'),minuteValues);
  const tEndH=mountStepper($('toolEndHour'),hourValues);
  const tEndM=mountStepper($('toolEndMin'),minuteValues);
  const tFromH=mountStepper($('toolPlanFromHour'),hourValues);
  const tFromM=mountStepper($('toolPlanFromMin'),minuteValues);
  const tToH=mountStepper($('toolPlanToHour'),hourValues);
  const tToM=mountStepper($('toolPlanToMin'),minuteValues);
  tStartH.setValue(9); tStartM.setValue(0);
  tEndH.setValue(10); tEndM.setValue(0);
  tFromH.setValue(9); tFromM.setValue(0);
  tToH.setValue(18); tToM.setValue(0);

  let toolMode='batch';
  const selectedRemove=new Set();
  function openTools(mode){
    toolMode=mode;
    const batch=mode==='batch', plan=mode==='plan';
    $('durationField').hidden=batch;
    $('toolTitle').placeholder=batch?'例如：晨读':'例如：复习';
    $('timeFieldBatch').hidden=!batch;
    $('timeFieldPlan').hidden=batch;
    $('toolsTabs').hidden=plan;
    $('weekdayRow').hidden=$('targetRow').querySelector('input:checked').value!=='weekday';
    selectedRemove.clear();

  function setToolView(view){
    const removing=view==='remove';
    if(removing) toolMode='remove';
    else if(toolMode==='remove') toolMode='batch';
    $('toolsAddFields').hidden=removing;
    $('toolsRemoveFields').hidden=!removing;
    $('toolsTabs').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.tab===view));
    if(removing){
      $('toolsTitle').textContent='批量删减日程';

      $('toolsNote').textContent='删除不可撤销，请确认勾选的日程';
      $('toolsRun').textContent='确认删除';

    }else{
      const plan=toolMode==='plan';
      $('toolsTitle').textContent=plan?'帮你规划':'批量添加日程';
      $('toolsSub').textContent=plan?'在期望时间段的空档中自动安排':'按规则批量写入多天';
      $('toolsNote').textContent=plan?'按期望时间段自动留出 10 分钟间隔':'节假日为内置 2026–2027 年放假安排';
      $('toolsRun').textContent=plan?'开始规划':'开始添加';
    }
  }
  function matchingEvents(kw){
    const out=[];
    for(const key in state.events){
      (state.events[key]||[]).forEach(e=>{
        const hit=!kw||(e.title||'').toLowerCase().indexOf(kw)>=0||(e.note||'').toLowerCase().indexOf(kw)>=0;
        if(hit) out.push({id:e.id,key:key,event:e});
      });
    }
    out.sort((a,b)=>a.key.localeCompare(b.key)||a.event.start-b.event.start);
    return out;
  }
  function renderRemoveResults(){
    const box=$('removeResults'), kw=$('removeKeyword').value.trim().toLowerCase();
    box.innerHTML='';
    if(!kw){
      $('removeResultCount').textContent='匹配日程';

      return;

    const found=matchingEvents(kw);
    $('removeResultCount').textContent='匹配到 '+found.length+' 项日程';
    if(!found.length){
      box.innerHTML='<div class="result-empty">没有找到包含该关键字的日程</div>';
      $('toggleAllResults').textContent='全选';

    found.forEach(x=>{

      const dot=document.createElement('span'); dot.className='result-dot'; dot.style.setProperty('--c',p.bg);

      main.appendChild(name); main.appendChild(meta);

  function runRemove(){
    if(!selectedRemove.size){ toast('请先勾选要删除的日程'); return; }
    let n=0;
    for(const key in state.events){
      const before=state.events[key].length;
      state.events[key]=state.events[key].filter(e=>!selectedRemove.has(e.id));
      n+=before-state.events[key].length;
    }
    selectedRemove.clear();
    save(); renderStrip(); buildColumns(); closeTools();
    toast('已批量删除 '+n+' 项日程');

  function closeTools(){

  function targetDates(){
    const count=clamp(Number($('toolCount').value)||1,1,520);
    const step=$('toolUnit').value==='week'?7:1;
    const target=$('targetRow').querySelector('input:checked').value;
    const wds=Array.from($('weekdayRow').querySelectorAll('input:checked')).map(x=>Number(x.value));
    const today=toKey(new Date()), out=[];
    for(let i=0;i<count*step;i++){
      const k=addDays(today,i), day=fromKey(k).getDay();
      let ok=false;
      if(target==='every') ok=true;
      else if(target==='workday') ok=MAKEUP_WORKDAYS.has(k)||(!HOLIDAYS.has(k)&&day>=1&&day<=5);
      else if(target==='holiday') ok=HOLIDAYS.has(k);
      else if(target==='weekday') ok=wds.includes(day);
      if(ok) out.push(k);
    }
    return out;
  }
  function findFreeSlot(list,ds,de,dur,gap){
    const blocks=list.map(e=>[clamp(e.start-gap,ds,de),clamp(e.end+gap,ds,de)])
      .filter(b=>b[1]>b[0]).sort((a,b)=>a[0]-b[0]);
    const merged=[];
    blocks.forEach(b=>{
      const last=merged[merged.length-1];
      if(last&&b[0]<=last[1]) last[1]=Math.max(last[1],b[1]);
      else merged.push([b[0],b[1]]);
    });
    let cursor=ds;
    for(const b of merged){
      if(b[0]-cursor>=dur) return cursor;
      cursor=Math.max(cursor,b[1]);
    }
    return de-cursor>=dur?cursor:null;
  }
  function runTool(){
    if(toolMode==='remove'){ runRemove(); return; }
    const title=$('toolTitle').value.trim()||(toolMode==='batch'?'新日程':'规划任务');
    const keys=targetDates();
    if(!keys.length){ toast('所选范围内没有符合条件的日期'); return; }
    let made=0;
    if(toolMode==='batch'){
      const s=clampM(tStartH.value()*60+tStartM.value());
      const e=clampM(tEndH.value()*60+tEndM.value());
      if(e<=s){ toast('结束时间需晚于开始时间'); return; }
      keys.forEach(k=>{
        eventList(k).push({id:uid(),title:title,note:'',colorIndex:state.colorCursor++%PALETTE.length,start:s,end:e});
        made++;
      });
    }else{
      const dur=clamp(snapM(Number($('toolDuration').value)||60),SNAP,END_HOUR*60);
      const ds=clampM(tFromH.value()*60+tFromM.value());
      const de=clampM(tToH.value()*60+tToM.value());
      if(de-ds<dur){ toast('期望时间段需长于所需时长'); return; }
      keys.forEach(k=>{
        const s=findFreeSlot(eventList(k),ds,de,dur,10);
        if(s===null) return;
        eventList(k).push({id:uid(),title:title,note:'',colorIndex:state.colorCursor++%PALETTE.length,start:s,end:s+dur});
        made++;
      });
    }
    save(); renderStrip(); buildColumns(); closeTools();
    toast((toolMode==='batch'?'已批量添加 ':'已规划 ')+made+' 项'+(made<keys.length?'（部分日期无合适空档）':''));
  }
  $('batchBtn').addEventListener('click',()=>openTools('batch'));

    const found=kw?matchingEvents(kw):[];
    if(!found.length){ toast('请先输入关键字搜索日程'); return; }
    const all=found.every(x=>selectedRemove.has(x.id));
    found.forEach(x=>{ if(all) selectedRemove.delete(x.id); else selectedRemove.add(x.id); });
    renderRemoveResults();
  });

  function renderSwatches(ev){
    const row=$('colorRow');
    row.innerHTML='<span class="label">颜色</span>';
    PALETTE.forEach((p,i)=>{
      const b=document.createElement('button');
      b.type='button'; b.className='swatch'+(i===ev.colorIndex%PALETTE.length?' on':'');
      b.style.background=p.bg; b.style.borderColor=i===ev.colorIndex%PALETTE.length?p.ink:'transparent';
      b.setAttribute('aria-label','颜色 '+(i+1));
      b.addEventListener('click',()=>{
        ev.colorIndex=i; save(); fillColumn(detail.key); renderSwatches(ev);
        $('detailAccent').style.background=p.bg;
      });
      row.appendChild(b);
    });
  }
  function populateDetail(ev,key){
    $('detailDate').textContent=fmtDate(key);
    titleInput.value=ev.title||'';
    startPicker.setValue(ev.start,false);
    endPicker.setValue(ev.end,false);
    noteInput.value=ev.note||'';
    $('detailAccent').style.background=PALETTE[ev.colorIndex%PALETTE.length].bg;
    renderSwatches(ev);
  }
  function openDetail(id,focusTitle){
    const found=findEvent(id);
    if(!found) return;
    const ev=found.event;
    const block=track.querySelector('.event[data-id="'+id+'"]');
    const from=block?block.getBoundingClientRect():null;
    detail.open=true; detail.id=id; detail.key=found.key;
    populateDetail(ev,found.key);
    document.body.classList.add('locked');
    overlay.classList.add('show');
    overlay.setAttribute('aria-hidden','false');

    card.style.transition='none';
    card.classList.add('visible');
    card.classList.remove('content-in');
    card.style.transform='translate3d(0,0,0) scale(1)';
    card.style.opacity='1';
    void card.offsetHeight;
    const to=card.getBoundingClientRect();
    if(from){
      const dx=from.left-to.left, dy=from.top-to.top;
      const sx=from.width/to.width, sy=from.height/to.height;
      card.style.transformOrigin='top left';
      card.style.transform='translate3d('+dx+'px,'+dy+'px,0) scale('+sx+','+sy+')';
      card.style.opacity='0.55';
    }else{
      card.style.transform='scale(.9)'; card.style.opacity='0';
    }
    void card.offsetHeight;
    card.style.transition='transform 430ms cubic-bezier(.2,.9,.25,1), opacity 320ms ease';
    requestAnimationFrame(()=>{
      card.style.transform='translate3d(0,0,0) scale(1)';
      card.style.opacity='1';
      card.classList.add('content-in');
    });
    if(block) block.classList.add('is-hidden');
    setTimeout(()=>{ if(detail.open&&focusTitle) titleInput.select(); },250);
  }
  function closeDetail(){
    if(!detail.open) return;
    const block=track.querySelector('.event[data-id="'+detail.id+'"]');
    const to=block?block.getBoundingClientRect():null;
    const cur=card.getBoundingClientRect();
    card.classList.remove('content-in');
    if(to&&cur.width){
      const dx=to.left-cur.left, dy=to.top-cur.top;
      const sx=to.width/cur.width, sy=to.height/cur.height;
      card.style.transition='transform 340ms cubic-bezier(.4,0,.2,1), opacity 300ms ease';
      card.style.transform='translate3d('+dx+'px,'+dy+'px,0) scale('+sx+','+sy+')';
      card.style.opacity='0.5';
    }else{
      card.style.transform='scale(.92)'; card.style.opacity='0';
    }
    overlay.classList.remove('show');
    overlay.setAttribute('aria-hidden','true');
    document.body.classList.remove('locked');
    setTimeout(()=>{
      card.style.transition='none';
      card.style.transform=''; card.style.opacity='';
      card.classList.remove('visible');
      if(block) block.classList.remove('is-hidden');
      detail.open=false; detail.id=null;
    },360);
  }

  function currentEvent(){ return detail.id?findEvent(detail.id):null; }
  function applyPickerTimes(){
    const f=currentEvent(); if(!f) return;
    let s=clampM(snapM(startPicker.value()));
    let e=clampM(snapM(endPicker.value()));
    let adjusted=false;
    if(e<=s){
      if(s>=END_HOUR*60-SNAP) s=Math.max(START_HOUR*60,s-SNAP);
      e=Math.min(END_HOUR*60,s+30);
      adjusted=true;
    }
    f.event.start=s; f.event.end=e;
    save(); fillColumn(f.key);
    // 仅在时间被强制纠正时回写滚轮，避免打断用户连续滚动
    if(adjusted){ startPicker.setValue(s,false); endPicker.setValue(e,false); }
  }

  titleInput.addEventListener('input',()=>{
    const f=currentEvent(); if(!f) return;
    f.event.title=titleInput.value; save(); fillColumn(f.key);
  });
  noteInput.addEventListener('input',()=>{
    const f=currentEvent(); if(!f) return;
    f.event.note=noteInput.value; save();
  });
  $('closeDetail').addEventListener('click',closeDetail);
  overlay.addEventListener('click',e=>{ if(e.target===overlay) closeDetail(); });
  card.addEventListener('click',e=>{
    if(e.target.closest('input,textarea,button,label,.stepper,.step-value,.time-picker')) return;
    closeDetail();
  });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeDetail(); closeTools(); } });
  $('deleteEvent').addEventListener('click',()=>{
    const f=currentEvent(); if(!f) return;
    state.events[f.key]=state.events[f.key].filter(x=>x.id!==f.event.id);
    save(); closeDetail(); fillColumn(f.key); toast('日程已删除');
  });

  /* ================= 工具栏 ================= */
  $('prevBtn').addEventListener('click',()=>{
    state.rangeStart=addDays(state.rangeStart,-7);
    state.selectedDate=addDays(state.selectedDate,-7);
    save(); renderStrip(); buildColumns();
  });
  $('nextBtn').addEventListener('click',()=>{
    state.rangeStart=addDays(state.rangeStart,7);
    state.selectedDate=addDays(state.selectedDate,7);
    save(); renderStrip(); buildColumns();
  });
  $('todayBtn').addEventListener('click',()=>{
    const today=toKey(new Date());
    state.rangeStart=mondayOf(today); state.selectedDate=today;
    save(); renderStrip(); buildColumns();
  });
  function applyTheme(){
    document.documentElement.dataset.theme=state.theme;
    $('iconMoon').hidden=state.theme==='dark';
    $('iconSun').hidden=state.theme!=='dark';
  }
  $('themeBtn').addEventListener('click',()=>{
    state.theme=state.theme==='dark'?'light':'dark';
    applyTheme(); save();
  });
  $('exportBtn').addEventListener('click',()=>{
    const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='schedule-'+toKey(new Date())+'.json';
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    toast('备份已导出');
  });

  /* ================= 启动 ================= */
  applyTheme();
  renderStrip();
  buildColumns();
  window.addEventListener('resize',()=>{ centerSelected(); updateAllFolds(); });
})();
</script>
</body>
</html>
